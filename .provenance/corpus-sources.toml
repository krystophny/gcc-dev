    "src",
]

# -----------------------------------------------------------------------------
# Recent non-GNU additions targeted at modern libstdc++ features
# (simd, ranges, mdspan, expected, stacktrace, coroutines), libgcc soft-float,
# and alternative C++ ABI / backtrace implementations.
# -----------------------------------------------------------------------------

# VcDevel/std-simd is the Matthias Kretz reference implementation that became
# std::experimental::simd (P1928).  libstdc++-v3/include/experimental/bits/simd*
# was merged into GCC directly from this tree in 2020 (BSD-3-Clause).  Strongest
# known critical-finding candidate.
[[source]]
name = "std-simd"
url = "git@github.com:VcDevel/std-simd.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "experimental",
    "tests",
]

# Eric Niebler's range-v3 is the progenitor of std::ranges.  Parts of
# libstdc++-v3/include/bits/ranges_* and std/ranges likely carry concepts and
# algorithms first published here (Boost Software License).
[[source]]
name = "range-v3"
url = "git@github.com:ericniebler/range-v3.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "include",
]

# Kokkos reference implementation of std::mdspan (C++23, P0009).  Candidate
# upstream for libstdc++-v3/include/std/mdspan and include/bits/mdspan.h
# (Apache-2.0 WITH LLVM-exception).
[[source]]
name = "kokkos-mdspan"
url = "git@github.com:kokkos/mdspan.git"
branch = "stable"
origin_class = "non_gnu"
sparse_paths = [
    "include",
]

# Sy Brand's tl::expected is the reference implementation of std::expected
# (P0323).  Candidate upstream for libstdc++-v3/include/std/expected
