# -----------------------------------------------------------------------------
# Expanded non-GNU corpus (overnight audit 2026-04-19)
#
# Focus areas:
#   - C runtime/libc variants beyond BSD/musl/bionic
#   - Allocators, hash tables, Unicode/locale, compression, JSON/parse
#   - Math/numerics libraries that commonly end up shadowed by GCC runtimes
#   - Historically-ported floating-point + printf/strtod pathways
#   - Widely-copied small utilities (PCG random, SipHash, xxHash, ...)
#
# Each entry is a blobless + sparse clone to keep on-disk cost bounded.
# -----------------------------------------------------------------------------

