# GMP has no canonical git repo; upstream lives in Mercurial at
# https://gmplib.org/repo/gmp/.  sethtroisi/libgmp is an established
# git mirror of that hg tree.  GMP ships its asm kernels as *.asm
# (m4-preprocessed), which is why KEEP_REGEX in fetch_corpus.sh has
# to retain the .asm extension.
[[source]]
name = "gmp"
url = "git@github.com:sethtroisi/libgmp.git"
branch = "master"
origin_class = "gnu"
sparse_paths = [
    "mpn",
