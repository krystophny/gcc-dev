# logic) may carry unattributed porting traces (BSD-3-Clause).
[[source]]
name = "berkeley-softfloat-3"
url = "git@github.com:ucb-bar/berkeley-softfloat-3.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "source",
]

