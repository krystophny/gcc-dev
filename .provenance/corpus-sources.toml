# -----------------------------------------------------------------------------
# Targeted expansion 2026-04-20: upstreams that feed specific GCC subtrees.
#
# gnulib proper        -> gcc/libiberty/, gcc/include/ (sha1, md5, getopt, ...)
# binutils-gdb         -> gcc/libiberty/, gcc/include/ (cross-project sibling)
# newlib-cygwin        -> gcc/libgcc/config/* overlap on embedded targets
# gettext              -> canonical-source sibling for glibc/gnulib imports
# ulfjack-ryu          -> gcc/libstdc++-v3/src/c++17/ryu/ (called out in #127)
# fmtlib               -> gcc/libstdc++-v3/include/std/format machinery
# a68g (Algol 68 Genie) -> gcc/libga68/, gcc/gcc/algol68/
# libatomic_ops        -> gcc/libatomic/, Boehm-GC-era atomic primitives
# gnucobol             -> gcc/libgcobol/ COBOL runtime
# -----------------------------------------------------------------------------

[[source]]
name = "gnulib"
url = "git@github.com:coreutils/gnulib.git"
branch = "master"
origin_class = "gnu"
sparse_paths = ["lib"]

