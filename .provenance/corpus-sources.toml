# Upstream source corpora for the non-testsuite provenance scanner.
#
# scripts/provenance/fetch_corpus.sh clones each entry into
# corpusbin/src/<name>/ using `git clone --filter=blob:none --depth=1` and a
# sparse-checkout restricted to the listed paths. The actual commit SHA used
# for each fetch is recorded in corpusbin/src/<name>/.corpus-sha so every
# index build is reproducible, even though we do not hard-pin SHAs here.
#
# `origin_class` is one of `gnu` (GCC/FSF sibling project, expected matches)
# or `non_gnu` (BSD / MIT / Apache / rust / go / d / musl / LLVM and similar —
# unattributed matches against these are the dangerous cases we are hunting).

version = 1

[[source]]
name = "freebsd-libc"
url = "git@github.com:freebsd/freebsd-src.git"
branch = "main"
origin_class = "non_gnu"
sparse_paths = [
    "lib/libc/stdlib",
    "lib/libc/string",
    "lib/libc/stdio",
    "lib/libc/locale",
    "lib/libc/gen",
    "lib/libc/regex",
    "lib/libc/iconv",
    "lib/libc/xdr",
    "sys/libkern",
]

