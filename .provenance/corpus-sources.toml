# LibreSSL portable is the OpenBSD fork of OpenSSL.  Shared low-level crypto
# helpers (compat code, big-number routines) may overlap with libiberty
# utility code and with the unpatched openssl corpus (ISC/BSD).
[[source]]
name = "libressl-portable"
url = "git@github.com:libressl/portable.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "crypto",
    "ssl",
    "tls",
    "include",
]

# Official LibreSSL crypto/ssl/tls source tree (imported from OpenBSD's
# libssl/libcrypto/libtls).  Pair with libressl-portable: portable carries
# BSD compat shims for libiberty comparison; this carries the real big-number
# and TLS crypto kernels (BSD-3-Clause / ISC).
[[source]]
name = "libressl-openbsd"
url = "git@github.com:libressl/openbsd.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "src/lib/libcrypto",
    "src/lib/libssl",
    "src/lib/libtls",
]

# -----------------------------------------------------------------------------
# Recent non-GNU expansion 2026-04-20 (round 2): modern permissive-licensed
# upstreams that feed specific GCC subtrees. Focus on active 2024-2026
# upstreams and on pairs where the GCC-side subtree is a direct mirror or
# close derivative. Highest-signal candidates at the top.
# -----------------------------------------------------------------------------

# dlang/phobos is the canonical D standard library; gcc/libphobos/src/std
# is a direct in-tree vendored copy. Boost Software License.  Forward
# scan should surface attribution gaps where libphobos files have been
# edited without preserving upstream headers.
[[source]]
name = "dlang-phobos"
url = "git@github.com:dlang/phobos.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = ["std", "etc"]

# Apple objc4 is the reference Objective-C runtime (APSL 2.0).  Cross-check
# against gcc/libobjc where selector dispatch, class layout, and associative
# reference code frequently rhyme across the two runtimes.
[[source]]
name = "apple-objc4"
url = "git@github.com:apple-oss-distributions/objc4.git"
branch = "main"
origin_class = "non_gnu"
sparse_paths = [
    "runtime",
    "include",
]

# Ziglang standard library is an active MIT-licensed C/system code base with
# fresh implementations of math, fmt, hash, compress, and crypto kernels.
# High chance of Zig borrowing GCC/glibc helpers, and of GCC helpers (libgcc
# soft-float style) inspiring Zig's zig/compiler_rt.
[[source]]
name = "zig-stdlib"
url = "git@github.com:ziglang/zig.git"
branch = "master"
origin_class = "non_gnu"
sparse_paths = [
    "lib/std",
    "lib/compiler_rt",
    "lib/libc",
]

