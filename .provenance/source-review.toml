resolution = "attributed"
rationale = "Per-file Ulf Adams Apache-2.0/Boost dual license block preserved; MERGE pins ulfjack/ryu commit 150d0c8783; LOCAL_PATCHES tracks GCC-local deltas."
issue = "https://github.com/krystophny/gcc-dev/issues/127"
reviewed_on = "2026-04-19"
reviewed_by = "krystophny"
chain = """
ulfjack/ryu 150d0c8783 (Ulf Adams, 2021-09-11, Apache-2.0 OR Boost-1.0)
  -> libstdc++-v3/src/c++17/ryu/ - per-file Ulf Adams copyright + dual
     license retained on every file; MERGE records the upstream SHA;
     LOCAL_PATCHES lists GCC-local revisions (r11-6248, r11-7636, r12-725)
  -> LLVM libcxx/src/include/ryu/ shares the same Ulf Adams upstream, so
     the scanner match is cross-upstream triangulation, not a libcxx import.
"""

