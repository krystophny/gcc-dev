# -----------------------------------------------------------------------------
# libstdc++ std::experimental::simd — same-author FSF-assigned contribution.
#
# VcDevel/std-simd is Matthias Kretz's Parallelism TS 2 reference implementation
# (© 2015-2020 GSI Helmholtzzentrum fuer Schwerionenforschung GmbH + Matthias
# Kretz, BSD-3-Clause).  It was imported verbatim into libstdc++ by Kretz
# himself in commit 2bcceb6fc59 (2021-01-21, Matthias Kretz <kretz@kde.org>,
# "libstdc++: Add std::experimental::simd from the Parallelism TS 2").
#
# The GCC copy drops the BSD-3-Clause header and the GSI + Kretz copyright
# line and carries only "Copyright (C) 2020-2026 Free Software Foundation,
# Inc." under GPL-3+ with the GCC Runtime Library Exception.  That relicense
# is legitimate under FSF copyright assignment, which GCC still required in
# 2021.  Kretz continues to maintain the BSD mirror at VcDevel/std-simd.
#
# Classifier sees the upstream BSD header as "silent" (no FSF attribution) and
# the GCC header as "marked" only weakly via the generic "This file is part of
# the GNU ISO C++ Library" phrase.  The scanner therefore surfaces 10 critical
# reverse-direction matches (winnow density 0.81-1.00, shingle Jaccard 0.50-
# 0.92).  All ten are the same same-author import.
#
# Resolution: attributed via author identity + FSF assignment.  No legal
# provenance gap.  A NOTE-style pointer to VcDevel/std-simd would be a
# nice-to-have consistent with the libstdc++-v3/src/c++17/ryu/ and
# libiberty/sha1.c conventions, but is not required because FSF holds
# copyright in the GCC copy.
# -----------------------------------------------------------------------------

