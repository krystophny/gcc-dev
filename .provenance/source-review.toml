[[reviewed]]
path = "gcc/include/sha1.h"
upstream = "glibc/locale/programs/md5.h"
resolution = "trail_gap"
rationale = "Gnulib-origin (not glibc); imported 2008 from gnulib without any origin phrase. Same-license trail gap; needs 'NOTE: This source is derived from gnulib (lib/sha1.h).'"
issue = "https://github.com/krystophny/gcc-dev/issues/123"
reviewed_on = "2026-04-20"
reviewed_by = "krystophny"
chain = """
Scott G. Miller sha1 implementation, authored for gnulib c. 2000
  -> gnulib lib/sha1.h (FSF, LGPL-2.1+)
  -> gcc/include/sha1.h at SVN r133503, 2008-03-25, Ian Lance Taylor
     (commit 598848e4d627, 'sha1.h: New file, from gnulib.')
  -> FSF relicense to GPLv3+ on 2010-04-20, Nick Clifton. No origin
     phrase retained in either import or relicense commit.
Scanner's glibc/locale/programs/md5.h hit is cross-hash noise on the
uint32_t feature-detection contortion block; true donor is gnulib.
"""

