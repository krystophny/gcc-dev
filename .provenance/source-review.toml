# Reviewed source-level provenance findings.
#
# Entries here are findings from scripts/provenance/scan_sources.py that a
# human has investigated and resolved.  The scanner (in a follow-up commit)
# will consume this file and suppress matching candidates on future runs so
# that the noisy "already reviewed" tail does not re-fire.
#
# Each entry must cite:
#   path         - gcc/<subtree>/<file>
#   upstream     - <corpus-project>/<relpath>
#   resolution   - "not_derived" | "trail_gap" | "attributed" |
#                  "license_conflict" | "wontfix" | "open"
#   rationale    - one-line summary; detail lives in the linked GitHub issue
#   issue        - GitHub issue URL or number (krystophny/gcc-dev)
#   reviewed_on  - YYYY-MM-DD
#   reviewed_by  - author of the review decision
#   chain        - optional multi-line literal string with the import chain
#
# See docs/provenance-research.md for the full research workflow.

version = 1

[[reviewed]]
path = "gcc/libquadmath/strtod/tens_in_limb.c"
upstream = "glibc/stdlib/tens_in_limb.c"
resolution = "trail_gap"
rationale = "glibc-originated import (SVN r170254, 2011); same-license LGPL-2.1+; upstream glibc itself ships the file header-less."
issue = "https://github.com/krystophny/gcc-dev/issues/121"
reviewed_on = "2026-04-19"
reviewed_by = "krystophny"
chain = """
GMP constants (mp_limb_t, BITS_PER_MP_LIMB; no tens_in_limb table)
  -> glibc pre-2008 inline in stdlib/strtod_l.c (LGPL-2.1+)
  -> glibc 2008-03-08, Drepper, split to stdlib/tens_in_limb.c, no header
     (bminor/glibc 72f1012788c0)
  -> GCC 2011-02-17, Jakub Jelinek, imports glibc strtod machinery into
     libquadmath (SVN r170254; gcc-mirror a855debfb46e; ML thread
     gcc-patches/2011-02/msg00885)
"""

