issue = "https://github.com/krystophny/gcc-dev/issues/123"
reviewed_on = "2026-04-20"
reviewed_by = "krystophny"
chain = """
glibc posix/getopt.h (FSF, LGPL-2.1+; declared 'also part of gnulib')
  -> gcc/include/getopt.h at SVN r14877, 1997-08-21, Jason Merrill;
     canonical-source note added at SVN r18980, 1998-04-03, Jeff Law
     ('dummy commit before merge' = sync-from-glibc); FSF relicense to
     GPLv2+. The 2019 glibc split into posix/getopt.h +
     posix/bits/getopt_ext.h postdates GCC's single-file copy, which
     is why the scanner's top hit is the partial-surface _ext.h file.
"""

